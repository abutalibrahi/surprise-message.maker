<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You have a Surprise!</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);min-height:100vh;overflow-x:hidden}
.glass-card{background:rgba(30,41,59,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.gift-box{font-size:100px;cursor:pointer;filter:drop-shadow(0 0 20px rgba(236,72,153,0.4));animation:bounce 2s infinite ease-in-out;transition:transform .3s}
.gift-box:hover{transform:scale(1.1) rotate(5deg)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.glow-btn{background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 0 20px rgba(99,102,241,0.5);transition:all .3s}
.glow-btn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(236,72,153,0.6)}
.msg-font{font-family:'Dancing Script',cursive;line-height:1.8}
.cursor{display:inline-block;width:2px;height:1.2em;background:#ec4899;margin-left:2px;animation:blink 1s step-end infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.screen-transition{transition:opacity .6s ease,transform .6s ease}
.hidden-screen{opacity:0;pointer-events:none;position:absolute;transform:scale(0.95)}
.visible-screen{opacity:1;pointer-events:auto;position:relative;transform:scale(1)}
.reveal-img{animation:imgReveal 1s ease-out forwards;opacity:0;transform:scale(0.8)}
@keyframes imgReveal{to{opacity:1;transform:scale(1)}}
.heart{position:fixed;bottom:-10%;animation:flyUp 4s linear forwards;pointer-events:none;z-index:50}
@keyframes flyUp{0%{transform:translateY(0) scale(0.5);opacity:0}10%{opacity:1;transform:translateY(-10vh) scale(1)}100%{transform:translateY(-120vh) scale(0.8);opacity:0}}
.img-loading{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
</style>
</head>
<body class="text-white flex flex-col items-center justify-center min-h-screen p-4">
<div class="flex-grow flex items-center justify-center w-full">
<div id="errorScreen" class="hidden text-center max-w-md"><div class="text-6xl mb-4">😕</div><h2 class="text-2xl font-bold mb-2">Invalid Link</h2><p class="text-slate-400">This surprise link seems broken or expired. Ask sender to create a new one!</p></div>
<div id="teaserScreen" class="screen-transition visible-screen text-center max-w-md w-full"><div class="glass-card rounded-3xl p-8 md:p-12"><div class="gift-box" onclick="reveal()">🎁</div><h1 class="text-2xl md:text-3xl font-bold mt-6 mb-2">Hey <span id="tName" class="text-pink-400"></span>!</h1><p class="text-slate-300 mb-8">Someone sent you a secret surprise ✨</p><button onclick="reveal()" class="glow-btn text-white font-bold py-3 px-8 rounded-full text-lg">Tap to Open ✨</button></div></div><div id="revealScreen" class="screen-transition hidden-screen text-center max-w-2xl w-full"><div class="glass-card rounded-3xl p-6 md:p-10 border-t-4 border-indigo-500"><p class="text-slate-400 uppercase tracking-widest text-xs mb-1">To</p><h2 id="rName" class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent mb-6"></h2><div id="imgContainer" class="hidden mb-6"><div id="imgLoader" class="img-loading text-4xl mb-2">📸</div><img id="revealImg" class="reveal-img max-h-72 md:max-h-96 mx-auto rounded-2xl shadow-2xl border-2 border-white/10 hidden" alt="Surprise Photo" onload="document.getElementById('imgLoader').classList.add('hidden');this.classList.remove('hidden')" onerror="document.getElementById('imgLoader').textContent='🖼️ Photo unavailable'"></div><div class="min-h-[80px] flex items-center justify-center mb-6"><p id="msgBox" class="msg-font text-xl md:text-2xl text-slate-200"></p><span id="cursor" class="cursor"></span></div><div class="border-t border-slate-700 pt-6 mt-4"><p class="text-slate-400 text-sm">With Love,</p><p id="sName" class="text-xl font-semibold text-white mt-1"></p></div><div id="badge" class="inline-block mt-6 px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-400 border border-slate-700"></div></div></div>
</div>
<footer class="mt-6 pb-4 text-center">
<p class="text-slate-500 text-sm tracking-wide">Created by <span class="bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent font-semibold">Rahi's Enterprise</span> ✨</p>
</footer><script>
let data=null;
function init(){try{const params=new URLSearchParams(window.location.search);const encoded=params.get('d');if(!encoded)throw new Error("No data");const decodedStr=decodeURIComponent(escape(atob(encoded)));data=JSON.parse(decodedStr);document.getElementById('tName').textContent=data.r}catch(e){console.error(e);document.getElementById('teaserScreen').classList.add('hidden');document.getElementById('errorScreen').classList.remove('hidden')}}
function reveal(){if(!data)return;const teaser=document.getElementById('teaserScreen'),revealEl=document.getElementById('revealScreen');teaser.classList.remove('visible-screen');teaser.classList.add('hidden-screen');setTimeout(()=>{teaser.style.display='none';revealEl.style.display='block';requestAnimationFrame(()=>{revealEl.classList.remove('hidden-screen');revealEl.classList.add('visible-screen');populateReveal();triggerEffects();startTypewriter()})},600)}
function populateReveal(){document.getElementById('rName').textContent=data.r;document.getElementById('sName').textContent='— '+data.s;if(data.img){document.getElementById('imgContainer').classList.remove('hidden');document.getElementById('revealImg').src=data.img}else if(data.i){document.getElementById('imgContainer').classList.remove('hidden');document.getElementById('revealImg').src=data.i}const badges={birthday:'🎂 Birthday',love:'💕 Love',gratitude:'🙏 Thanks',friendship:'🤝 Friend'};document.getElementById('badge').textContent=badges[data.o]||'✨ Special'}
function triggerEffects(){if(data.o==='love'){const emojis=['❤️','💖','💕','💗','💘'];for(let i=0;i<30;i++){setTimeout(()=>{const h=document.createElement('div');h.className='heart';h.textContent=emojis[Math.floor(Math.random()*emojis.length)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(20+Math.random()*30)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),4000)},i*200)}}else{const colors=['#6366f1','#ec4899','#fbbf24','#34d399'];const end=Date.now()+3000;(function frame(){confetti({particleCount:3,angle:60,spread:55,origin:{x:0},colors});confetti({particleCount:3,angle:120,spread:55,origin:{x:1},colors});if(Date.now()<end)requestAnimationFrame(frame)}())}}
function startTypewriter(){const txt=data.m,el=document.getElementById('msgBox'),cur=document.getElementById('cursor');let idx=0;function type(){if(idx<txt.length){el.textContent+=txt.charAt(idx);idx++;const delay=txt.charAt(idx-1)==='.'?400:(txt.charAt(idx-1)===','?200:40+Math.random()*40);setTimeout(type,delay)}else{setTimeout(()=>cur.style.display='none',1000)}}setTimeout(type,800)}
window.onload=init;
</script>
</body>
</html>
